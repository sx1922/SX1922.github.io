<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏熊生存战争服务器网站</title>
    
    <!-- Favicon 图标 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            opacity: 0;
            animation: fadeIn 1s forwards;
            margin: 0;
            padding: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        header {
            background-color: #633838;
            color: white;
            text-align: center;
            padding: 1000px 0; /* 修改为更合适的高度 */
            background-image: url('封面.jpg'); /* 背景图像 */
            background-size: cover; /* 让背景图像覆盖整个区域 */
            background-position: center; /* 背景图像居中 */
            background-repeat: no-repeat; /* 背景图像不重复 */
            background-attachment: fixed; /* 固定背景图像，使其在滚动时保持不变 */
        }

        /* 动态时钟样式 */
        #server-time {
            font-size: 24px;
            color: white;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
            margin: 20px auto;
        }

        section {
            margin: 20px;
        }

        .content {
            position: relative;
            z-index: 2;
            margin: 30px;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .overlay {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 3;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
            font-size: 16px;
        }

        /* 图片滚动动画 */
        img {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            width: 100%;
            height: auto;
        }

        img.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 社交媒体图标样式 */
        .social-icons a {
            margin: 0 10px;
            font-size: 30px;
            color: #333;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #007bff;
        }

        /* 最近活动模块 */
        #events {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .event h3 {
            color: #633838;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .event p {
            color: #555;
            font-size: 16px;
        }

        .countdown {
            font-weight: bold;
            color: #007bff;
            font-size: 18px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            header {
                padding: 40px 0;
            }

            .content {
                margin: 15px;
                padding: 15px;
            }

            .overlay {
                width: 80%;
                top: 30%;
                padding: 15px;
            }

            img {
                width: 100%;
                height: auto;
            }

            .social-icons a {
                font-size: 26px;
            }

            .event h3 {
                font-size: 20px;
            }

            .event p, .countdown {
                font-size: 14px;
            }
        }

        /* 返回顶部按钮样式 */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: none;  /* 默认隐藏按钮 */
            transition: background-color 0.3s, opacity 0.3s, transform 0.3s;
        }

        .back-to-top.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>欢迎来到苏熊生存战争服务器网站</h1>
</header>

<!-- 动态时钟 -->
<div id="server-time"></div>
    <h2>关于服务器</h2>
    <ul>
        <li>服务器名称：大林服务器</li>
        <li>生存战争版本：2.3联机版</li>
        <li>腐竹：达瓦里氏苏熊</li>
    </ul>
    

</section>

<div class="content">
    <h1>服务器详细信息</h1>
</div>
<div class="overlay">
    <h2 style="color:red;">生存战争最斯大林化的服务器</h2>
</div>
<!-- 懒加载 -->
<img class="lazy" data-src="sx.jpg" alt="腐竹">
</section>

<section>
    <h1>服务器一周目</h1>
    <img class="lazy" data-src="1 (1).jpg" alt="图片1">
    <img class="lazy" data-src="1 (2).jpg" alt="图片2">
    <img class="lazy" data-src="1 (3).jpg" alt="图片3">
    <img class="lazy" data-src="1 (4).jpg" alt="图片4">
    <img class="lazy" data-src="1 (5).jpg" alt="图片5">
</section>

<!-- 公告模块 -->
<section>
    <h2>公告</h2>
    <div id="events">
        <div class="event">
            <h3>生存大赛</h3>
            <p>时间：2025年2月15日 20:00</p>
            <p>描述：参与生存大赛，赢取丰厚奖品！</p>
            <p class="countdown"></p>
        </div>
        <div class="event">
            <h3>建造竞赛</h3>
            <p>时间：2025年2月20日 18:00</p>
            <p>描述：展示你的建筑技巧，争夺最佳建造奖！</p>
            <p class="countdown"></p>
        </div>
    </div>
</section>

<!-- 社交媒体链接 -->
<section>
    <h1>关注我们</h1>
    <div class="social-icons">
        <a href="https://space.bilibili.com/1980175565?spm_id_from=333.1007.0.0" target="_blank">
            <i class="fab fa-bilibili"></i>
        </a>
        <a href="https://jq.qq.com/?_wv=1027&k=57BdT9n" target="_blank">
            <i class="fab fa-qq"></i>
        </a>
    </div>
</section>

<!-- 服务器守则链接 -->
<section>
    <a href="2sx.html" class="btn btn-secondary">查看服务器守则</a>
</section>

<!-- 返回顶部按钮 -->
<button class="back-to-top">返回顶部</button>

<!-- 脚本 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // 图片懒加载功能
    $(document).ready(function () {
    $("img.lazy").each(function () {
        var img = $(this);
        var dataSrc = img.attr("data-src");
        if (dataSrc) {
            img.attr("src", dataSrc);
            img.addClass("visible");
        }
    });
});

    // 时钟更新
    function updateServerTime() {
        var now = new Date();
        var timeString = now.toLocaleString();
        document.getElementById("server-time").textContent = "当前时间: " + timeString;
    }
    setInterval(updateServerTime, 1000);
    updateServerTime();

    // 返回顶部按钮显示与隐藏
    $(window).scroll(function () {
        if ($(this).scrollTop() > 200) {
            $(".back-to-top").addClass("show");
        } else {
            $(".back-to-top").removeClass("show");
        }
    });

    $(".back-to-top").click(function () {
        $("html, body").animate({ scrollTop: 0 }, 500);
        return false;
    });

    // 活动倒计时
    var events = document.querySelectorAll(".event");
    events.forEach(function (event) {
        var eventTimeText = event.querySelector("p").textContent.match(/\d{4}年\d{1,2}月\d{1,2}日 \d{1,2}:\d{2}/);
        if (!eventTimeText) return;
        
        var eventTime = new Date(eventTimeText[0].replace(/年|月/g, "/").replace(/日/, ""));
        var countdownElement = event.querySelector(".countdown");

        function updateCountdown() {
            var now = new Date();
            var diff = eventTime - now;
            if (diff <= 0) {
                countdownElement.textContent = "活动开始！";
            } else {
                var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                countdownElement.textContent = `${days}天 ${hours}小时 ${minutes}分钟`;
            }
        }
        setInterval(updateCountdown, 60000);
        updateCountdown();
    });
</script>

</body>
</html>
