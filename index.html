    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            opacity: 0;
            animation: fadeIn 1s forwards;
            margin: 0;
            padding: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        header {
            background-color: #633838;
            color: white;
            text-align: center;
            padding: 1000px 0; /* 修改为更合适的高度 */
            background-image: url('封面.jpg'); /* 背景图像 */
            background-size: cover; /* 让背景图像覆盖整个区域 */
            background-position: center; /* 背景图像居中 */
            background-repeat: no-repeat; /* 背景图像不重复 */
            background-attachment: fixed; /* 固定背景图像，使其在滚动时保持不变 */
        }

        /* 动态时钟样式 */
        #server-time {
            font-size: 24px;
            color: white;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            width: fit-content;
            margin: 20px auto;
        }

        section {
            margin: 20px;
        }

        .content {
            position: relative;
            z-index: 2;
            margin: 30px;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .overlay {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 3;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
            font-size: 16px;
        }

        /* 图片滚动动画 */
        img {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            width: 100%;
            height: auto;
        }

        img.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 社交媒体图标样式 */
        .social-icons a {
            margin: 0 10px;
            font-size: 30px;
            color: #333;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #007bff;
        }

        /* 最近活动模块 */
        #events {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .event h3 {
            color: #633838;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .event p {
            color: #555;
            font-size: 16px;
        }

        .countdown {
            font-weight: bold;
            color: #007bff;
            font-size: 18px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            header {
                padding: 40px 0;
            }

            .content {
                margin: 15px;
                padding: 15px;
            }

            .overlay {
                width: 80%;
                top: 30%;
                padding: 15px;
            }

            img {
                width: 100%;
                height: auto;
            }

            .social-icons a {
                font-size: 26px;
            }

            .event h3 {
                font-size: 20px;
            }

            .event p, .countdown {
                font-size: 14px;
            }
        }

        /* 返回顶部按钮样式 */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: none;  /* 默认隐藏按钮 */
            transition: background-color 0.3s, opacity 0.3s, transform 0.3s;
        }

        .back-to-top.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<!-- 样式部分 -->
<style>
    :root {
        /* 日间模式变量 */
        --bg-color: #ffffff;
        --text-color: #333333;
        --nav-bg: #633838;
        --nav-text: #ffffff;
        --nav-hover: rgba(255,255,255,0.2);
        --section-bg: #f8f8f8;
        
        /* 夜间模式变量 */
        --dark-bg-color: #1a1a1a;
        --dark-text-color: #e0e0e0;
        --dark-nav-bg: #2d0f0f;
        --dark-nav-hover: rgba(255,255,255,0.1);
        --dark-section-bg: #2d2d2d;
    }

    /* 导航栏样式 */
    .main-nav {
        background: var(--nav-bg);
        padding: 1rem 2rem;
        position: sticky;
        top: 0;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
    }

    .nav-links {
        display: flex;
        gap: 2rem;
        align-items: center;
    }

    .nav-links a {
        color: var(--nav-text);
        text-decoration: none;
        padding: 0.8rem 1.2rem;
        border-radius: 5px;
        transition: all 0.3s ease;
        position: relative;
        font-weight: 500;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--nav-text);
        transition: all 0.3s ease;
    }

    .nav-links a:hover::after {
        width: 100%;
        left: 0;
    }

    .nav-links a:hover {
        background: var(--nav-hover);
    }

    /* 夜间模式切换按钮 */
    .theme-toggle {
        background: none;
        border: none;
        color: var(--nav-text);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 50%;
        transition: all 0.3s ease;
    }

    .theme-toggle:hover {
        background: var(--nav-hover);
    }

    /* 全局样式 */
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
    }

    section {
        background-color: var(--section-bg);
        margin: 2rem;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* 夜间模式 */
    body.dark-mode {
        --bg-color: var(--dark-bg-color);
        --text-color: var(--dark-text-color);
        --nav-bg: var(--dark-nav-bg);
        --nav-hover: var(--dark-nav-hover);
        --section-bg: var(--dark-section-bg);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        .nav-links {
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }

        .main-nav {
            padding: 1rem;
            flex-direction: column;
        }
    }
</style>
</head>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // 图片懒加载功能
    $(document).ready(function () {
    $("img.lazy").each(function () {
        var img = $(this);
        var dataSrc = img.attr("data-src");
        if (dataSrc) {
            img.attr("src", dataSrc);
            img.addClass("visible");
        }
    });
});

    // 时钟更新
    function updateServerTime() {
        var now = new Date();
        var timeString = now.toLocaleString();
        document.getElementById("server-time").textContent = "当前时间: " + timeString;
    }
    setInterval(updateServerTime, 1000);
    updateServerTime();

    // 返回顶部按钮显示与隐藏
    $(window).scroll(function () {
        if ($(this).scrollTop() > 200) {
            $(".back-to-top").addClass("show");
        } else {
            $(".back-to-top").removeClass("show");
        }
    });

    $(".back-to-top").click(function () {
        $("html, body").animate({ scrollTop: 0 }, 500);
        return false;
    });

    // 活动倒计时
    var events = document.querySelectorAll(".event");
    events.forEach(function (event) {
        var eventTimeText = event.querySelector("p").textContent.match(/\d{4}年\d{1,2}月\d{1,2}日 \d{1,2}:\d{2}/);
        if (!eventTimeText) return;
        
        var eventTime = new Date(eventTimeText[0].replace(/年|月/g, "/").replace(/日/, ""));
        var countdownElement = event.querySelector(".countdown");

        function updateCountdown() {
            var now = new Date();
            var diff = eventTime - now;
            if (diff <= 0) {
                countdownElement.textContent = "活动开始！";
            } else {
                var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                countdownElement.textContent = `${days}天 ${hours}小时 ${minutes}分钟`;
            }
        }
        setInterval(updateCountdown, 60000);
        updateCountdown();
    });
</script>
<script>
    // 夜间模式切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    // 读取本地存储
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
        body.classList.add(savedTheme);
        updateButtonIcon();
    }

    themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark-mode' : '');
        updateButtonIcon();
    });

    function updateButtonIcon() {
        themeToggle.textContent = body.classList.contains('dark-mode') ? '🌜' : '🌞';
    }

    // 平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            target.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });
    });
</script>
</body>
